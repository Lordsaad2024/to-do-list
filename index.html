<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Import js and css -->
    <link rel="stylesheet" href="style.css">
    <script src="logic.js" defer></script>
    <title>Product Store</title>
</head>
<body>
    <div class="crud">
        <header>
            <div class="head">
                <h1>CRUDS</h1>
                <p>Product management system</p>
            </div>
        </header>
        <main>
            <section class="inputs">
                <input type="text" id="title" placeholder="Title">
                <div class="price">
                    <input type="number" onkeyup="getTotal()" id="price" placeholder="Price">
                    <input type="number" onkeyup="getTotal()" id="taxt" placeholder="Taxt">
                    <input type="number" onkeyup="getTotal()" id="ads" placeholder="Ads">
                    <input type="number" onkeyup="getTotal()" id="discount" placeholder="Discount">
                    <small id="total"></small>
                </div>
                <input type="number" placeholder="Count" id="count">
                <input type="text" placeholder="Category" id="category">
                <button id="Submit">Create</button>
               
            </section>
            <section class="outputs">
                <div class="searchBlock">
                    <input type="text" placeholder="Search" id="search" onkeyup="searchData(this.value)">
                    <div class="btn-search">
                        <button onclick="getSearchMod(this.id)" id="searchByTitle">Search By Title</button>
                        <button onclick="getSearchMod(this.id)" id="searchByCategory">Search By Category</button>
                    </div>
                    
                </div>
                <div id="delete-all">

                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th>Title</th>
                            <th>Price</th>
                            <th>Taxes</th>
                            <th>Ads</th>
                            <th>Discount</th>
                            <th>Total</th>
                            <th>category</th>
                            <th>Count</th>
                            <th>Update</th>
                            <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody id="table">
                        
                    </tbody>
                </table>
            </section>
        </main>

    </div>
    
</body>
</html>
